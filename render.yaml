# Render Blueprint — deploy backend as a Docker web service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: landfello-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://website-zk2l.vercel.app
      - key: CORS_ORIGINS
        value: https://website-zk2l.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        value: sqlite:////data/landfello.db
